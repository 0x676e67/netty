[package]
name = "wreq-native-qpack"
version = "0.0.0"
edition = "2021"
publish = false
[workspace]

[features]
http3-datagram = []
[[bin]]
name = "native-peer"
path = "src/main.rs"
[[test]]
name = "churn"
path = "churn.rs"
[[test]]
name = "blocked"
path = "blocked.rs"
[dependencies]
aws-lc-sys = { version = "=0.43.0", features = ["ssl"] }
ngtcp2-sys = "=0.2.0"
nghttp3-sys = "=0.2.0"
[build-dependencies]
cc = "=1.4.6"
[dev-dependencies]
http3 = { version = "=0.1.1", features = ["unstable"] }
futures-util = "0.3"
wreq-proto = { path = "../..", features = ["full"] }
bytes = "1"
http = "1"
http-body-util = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "process", "io-util"] }
quic = { version = "=0.12.1", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
quinn = { version = "=0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = "=0.14.9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tempfile = "3"
serde_json = "1"
[patch.crates-io]
http3 = { git = "https://github.com/0x676e67/http3", rev = "e7103dc594a88b8473a1f6af477c5e17266767cb" }

[[test]]
name = "cancel_body"
path = "cancel_body.rs"
