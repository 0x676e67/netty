[package]
publish = false
autobenches = false
name = "wreq-proto"
version = "0.2.5"
homepage = "https://github.com/0x676e67/wreq"
description = "Protocol utilities for wreq"
keywords = ["http", "client"]
categories = ["web-programming::http-client"]
repository = "https://github.com/0x676e67/wreq-proto"
documentation = "https://docs.rs/wreq-proto"
authors = ["0x676e67 <gngppz@gmail.com>", "Sean McArthur <sean@seanmonstar.com>"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.85"
include = ["README.md", "LICENSE", "src/**/*.rs"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]

[features]
default = []

full = ["tracing", "http3", "http3-datagram"]

# HTTP/3 over an externally established QUIC connection.
http3 = ["dep:http3", "tokio-util/rt"]
http3-datagram = ["http3", "dep:http3-datagram"]

# Enable tracing logging.
tracing = ["dep:tracing", "http2/tracing", "tracing?/std", "http3?/tracing"]

[dependencies]
bytes = "1.11.1"
http = "1.4.0"
http2 = { version = "0.5.16", features = ["unstable"] }
httparse = "1.10.1"
http-body = "1.0.1"
want = "0.3.1"
pin-project-lite = "0.2.17"
futures-channel = "0.3.32"
futures-util = { version = "0.3.32", default-features = false }
smallvec = { version = "1.15.1", features = ["const_generics", "const_new"] }
tokio = { version = "1.52.3", default-features = false }
tokio-util = { version = "0.7.18", default-features = false }

# Optional deps...


http3 = { version = "=0.1.1", features = ["unstable"], optional = true }
http3-datagram = { version = "=0.1.1", optional = true }

tracing = { version = "0.1", default-features = false, optional = true }

[dev-dependencies]
compio = { version = "0.19.0-rc.1", features = ["io", "io-compat", "runtime", "time"] }
send_wrapper = "0.6.0"
socket2 = "0.6.4"
h3 = "=0.0.8"
h3-quinn = "=0.0.10"
http3-quic = "=0.1.1"
quic = { version = "=0.12.1", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = "=0.14.9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
http-body-util = "0.1.3"
pretty_env_logger = "0.5"
futures-channel = { version = "0.3", features = ["sink"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc", "sink"] }
wreq-proto = { path = "." }
hyper = { version = "1.7.0", default-features = false, features = [
    "http1",
    "http2",
    "server",
] }
h2 = "0.4.6"
spmc = "0.3"
tokio = { version = "1", features = [
    "fs",
    "macros",
    "net",
    "io-std",
    "io-util",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
    "test-util",
] }
tokio-test = "0.4.5"
tracing = "0.1"
tracing-subscriber = "0.3"

[[bench]]
name = "http3"
path = "bench/http3.rs"
required-features = ["http3"]
harness = false

[[test]]
name = "client"
path = "tests/client.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "http3"
path = "tests/http3.rs"
required-features = ["http3"]

[lib]
bench = false

[[bench]]
name = "http2-adapter"
path = "bench/http2-adapter.rs"
harness = false

[workspace]
resolver = "3"
exclude = [".agents/worktrees/http3", ".agents/worktrees/http3/*", ".agents/worktrees/vproxy"]

[profile.release]
codegen-units = 1
incremental = false

[profile.bench]
codegen-units = 1
incremental = false

# PR #104 includes #103's lifecycle fixes and preserves QPACK Base after eviction.
[patch.crates-io]
http3 = { git = "https://github.com/0x676e67/http3", rev = "e7103dc594a88b8473a1f6af477c5e17266767cb" }
# https://github.com/0x676e67/quic/pull/50: report stopped writes without connection credit.
quic = { git = "https://github.com/0x676e67/quic", rev = "ce89cf67bf68a95598030b53f165ef71feed5f70" }
quic-proto = { git = "https://github.com/0x676e67/quic", rev = "ce89cf67bf68a95598030b53f165ef71feed5f70" }
